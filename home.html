<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<title>Issue Tracker</title>
</head>

<body class="bg-gray-100 min-h-screen">

<header class="mb-10">
  <div class="navbar bg-base-100 shadow-sm flex flex-wrap items-center gap-3">

    <div class="flex items-center gap-2 w-full sm:w-auto">
      <img class="w-8 md:w-10" src="./assets/github-logo.png" alt="logo">

      <h1 class="text-lg md:text-xl font-semibold leading-tight">
        Github Issue Tracker
      </h1>
    </div>

    
    <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto sm:ml-auto">

      <label class="input w-full sm:w-auto">
        
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </g>
        </svg>
       

        <input type="text" placeholder="Search Issue"
        class="w-full md:w-52" id="search" />
      </label>

      <button class="btn btn-primary w-full sm:w-auto" id="btnSearch">
        Search
      </button>

    </div>

  </div>
</header>

<main class="container mx-auto px-4">

<section class="w-full">

<div class="navbar bg-base-100 shadow-sm" id="all-btn">

<div class="flex flex-wrap gap-2 w-full sm:w-auto">

<button class="btn btn-primary flex-1 sm:flex-none allbtn" id="all">
All
</button>

<button class="btn btn-outline flex-1 sm:flex-none allbtn" id="open">
Open
</button>

<button class="btn btn-outline flex-1 sm:flex-none allbtn" id="close">
Close
</button>

</div>

</div>

</section>


<section class="mt-8 mb-6">
  <div class="bg-base-100 shadow-sm rounded-xl p-4">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-primary/10 p-2 rounded-full">
          <img src="./assets/Aperture.png" class="w-6">
        </div>
        <div>
          <h2 class="text-xl font-semibold"><span id="issues">50</span> Issues</h2>
          <p class="text-sm opacity-60">Track and manage your project issues</p>
        </div>
      </div>

      <div class="flex gap-6 mt-4 md:mt-0 text-sm">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-[#00A96E] rounded-full"></span> Open
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-[#A855F7] rounded-full"></span> Closed
        </div>
      </div>
    </div>
  </div>
</section>

<div class="text-center mt-20 hidden" id="spinner" >
<span class="loading loading-spinner loading-xl"></span>
</div>

<section class="mt-4 pb-10">
  <div class="grid  sm:grid-cols-3 lg:grid-cols-4 gap-5 items-stretch" id="issuesContainer">
    </div>
</section>
 


<dialog id="issue_modal" class="modal">
  <div class="modal-box max-w-2xl p-8 rounded-3xl">
    <div id="modal-content">
      </div>
    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-primary bg-[#6366F1] border-none px-8 rounded-xl text-white">Close</button>
      </form>
    </div>
  </div>
</dialog>

</main>


<script src="./script.js"></script>
</body>
</html>
